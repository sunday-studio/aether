name: Build Platform

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      target:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: true
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: true
      APPLE_CERTIFICATE:
        required: true
      APPLE_CERTIFICATE_PASSWORD:
        required: true
      APPLE_SIGNING_IDENTITY:
        required: true
      APPLE_ID:
        required: true
      APPLE_PASSWORD:
        required: true
      APPLE_TEAM_ID:
        required: true
      KEYCHAIN_PASSWORD:
        required: true

jobs:
  build:
    name: Build ${{ inputs.target }}
    runs-on: ${{ inputs.platform }}
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.target }}
      
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop/src-tauri -> target'
      
      - name: Install Linux dependencies
        if: inputs.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev
      
      - name: Import Apple Developer Certificate
        if: inputs.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
      
      - name: Verify Certificate and Set Identity
        if: inputs.platform == 'macos-latest'
        env:
          EXPECTED_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application'
          security find-identity -v -p codesigning build.keychain | grep -F "$EXPECTED_IDENTITY"
          echo "APPLE_SIGNING_IDENTITY=$EXPECTED_IDENTITY" >> "$GITHUB_ENV"
      
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        working-directory: desktop
        run: pnpm run generate:sdk
      
      - name: Verify committed desktop version
        working-directory: desktop
        run: pnpm run check:version -- ${{ inputs.version }}
      
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --target ${{ inputs.target }}

      # Tauri names the macOS updater archive without its Rust target. Keep the
      # release asset self-describing so the publisher can prove it contains
      # only the requested architecture.
      - name: Name macOS updater archive for target
        if: inputs.platform == 'macos-latest'
        shell: bash
        run: |
          bundle_dir="desktop/src-tauri/target/${{ inputs.target }}/release/bundle/macos"
          archive_count="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.app.tar.gz' -print | wc -l | tr -d ' ')"
          if [[ "$archive_count" != "1" ]]; then
            echo "Expected exactly one macOS updater archive, found $archive_count" >&2
            exit 1
          fi
          archive="$(find "$bundle_dir" -maxdepth 1 -type f -name '*.app.tar.gz' -print)"
          signature="${archive}.sig"
          if [[ ! -s "$signature" ]]; then
            echo "Missing or empty updater signature: $signature" >&2
            exit 1
          fi
          renamed_archive="${archive%.app.tar.gz}_${{ inputs.target }}.app.tar.gz"
          mv "$archive" "$renamed_archive"
          mv "$signature" "${renamed_archive}.sig"
          printf 'Renamed updater archive to %s\n' "$renamed_archive"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ inputs.target }}
          path: |
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.dmg
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.app.tar.gz
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.app.tar.gz.sig
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.AppImage
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.AppImage.sig
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.deb
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.msi
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.msi.sig
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.exe
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.nsis.zip
            desktop/src-tauri/target/${{ inputs.target }}/release/bundle/**/*.nsis.zip.sig
          if-no-files-found: error
          retention-days: 1
