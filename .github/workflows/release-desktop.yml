name: Release

# Runs automatically on every push to main (e.g. when a PR is merged). Release only proceeds if
# the merged PR description contains "## Release Notes" and "### Version: X.Y.Z" with content.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.0.1) — leave blank to use merged PR Release Notes'
        required: false
      release_notes:
        description: 'Release notes (markdown) — leave blank to use merged PR body'
        required: false

permissions:
  contents: write
  pages: write
  pull-requests: read

jobs:
  check-release:
    uses: ./.github/workflows/check-release.yml
    with:
      manual_version: ${{ inputs.version }}
      manual_release_notes: ${{ inputs.release_notes }}
    permissions:
      contents: read
      pull-requests: read

  test-suite:
    name: Release preflight tests
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Generate SDK
        working-directory: desktop
        run: pnpm run generate:sdk

      - name: Frontend lint
        working-directory: desktop
        run: pnpm run lint

      - name: Frontend build
        working-directory: desktop
        run: pnpm run build

      - name: Verify committed desktop version
        working-directory: desktop
        run: pnpm run check:version -- ${{ needs.check-release.outputs.version }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./desktop/src-tauri -> target
            ./sync-server -> target
          key: release-preflight

      - name: Desktop child task tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml task_child_resources --lib

      - name: Desktop Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --all-targets

      - name: Sync server tests
        run: cargo test --manifest-path sync-server/Cargo.toml --all-targets

  # Keep an unsuccessful credential configuration from creating an unreleasable tag.
  release-credentials:
    name: Verify release credentials
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Require signing and notarization credentials
        shell: bash
        run: |
          required_secrets=(
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_ID
            APPLE_PASSWORD
            APPLE_TEAM_ID
            KEYCHAIN_PASSWORD
          )
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name}" ]]; then
              missing_secrets+=("$secret_name")
            fi
          done
          if ((${#missing_secrets[@]})); then
            printf 'Missing required release secrets: %s\\n' "${missing_secrets[*]}" >&2
            exit 1
          fi

  # Step 2: Create the version tag only after tests and credentials pass.
  create-tag:
    name: Create Version Tag
    needs: [check-release, test-suite, release-credentials]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Create and push tag
        run: |
          VERSION="${{ needs.check-release.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  # Step 3: Build for Apple Silicon only.
  build-macos-silicon:
    needs: [check-release, create-tag]
    if: needs.check-release.outputs.should_release == 'true'
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: macos-latest
      target: aarch64-apple-darwin
      version: ${{ needs.check-release.outputs.version }}
    secrets: inherit

  # Step 4: Create a draft release, validate its update manifest, then publish it.
  # The mutable static feed is deliberately promoted by a later job, after this release is public.
  publish-release:
    name: Publish Release
    needs: 
      - check-release
      - build-macos-silicon
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} release/ \;
          ls -la release/
      
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          name: Aether v${{ needs.check-release.outputs.version }}
          body: ${{ needs.check-release.outputs.release_notes }}
          draft: true
          prerelease: false
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Generate and validate updater manifest
        uses: actions/github-script@v7
        env:
          RELEASE_NOTES: ${{ needs.check-release.outputs.release_notes }}
        with:
          script: |
            const fs = require('fs');
            const version = '${{ needs.check-release.outputs.version }}';
            const notes = process.env.RELEASE_NOTES;
            const files = fs.readdirSync('release');
            const manifest = {
              version,
              pub_date: new Date().toISOString(),
              notes,
              platforms: {}
            };
            const platformPatterns = {
              'darwin-aarch64': /(aarch64|arm64)/i
            };
            for (const [platform, targetPattern] of Object.entries(platformPatterns)) {
              const binaries = files.filter(file =>
                file.endsWith('.app.tar.gz') && targetPattern.test(file),
              );
              if (binaries.length !== 1) {
                throw new Error(`Expected exactly one ${platform} updater archive, found: ${binaries.join(', ') || 'none'}`);
              }
              const binary = binaries[0];
              const signatureFile = `${binary}.sig`;
              if (!files.includes(signatureFile)) {
                throw new Error(`Missing signature for ${platform} updater archive: ${signatureFile}`);
              }
              const signature = fs.readFileSync(`release/${signatureFile}`, 'utf8').trim();
              if (!signature) {
                throw new Error(`Empty signature for ${platform} updater archive: ${signatureFile}`);
              }
              manifest.platforms[platform] = {
                signature,
                url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/${encodeURIComponent(binary)}`
              };
              console.log(`Validated ${platform}: ${binary}`);
            }
            if (Object.keys(manifest.platforms).length !== 1) {
              throw new Error('Updater manifest is missing the required Apple Silicon archive');
            }
            const manifestJson = JSON.stringify(manifest, null, 2);
            fs.writeFileSync('release/latest.json', manifestJson);
            console.log('Generated manifest:', manifestJson);
      
      - name: Publish GitHub Release and archive updater manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          files: release/latest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          echo "## Release v${{ needs.check-release.outputs.version }} Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** macOS (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/v${{ needs.check-release.outputs.version }})" >> $GITHUB_STEP_SUMMARY

  promote-update-feed:
    name: Promote desktop update feed
    needs: [check-release, publish-release]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Download updater manifest
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rebuild and validate updater manifest
        env:
          RELEASE_NOTES: ${{ needs.check-release.outputs.release_notes }}
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) -exec cp {} release/ \;
          node <<'NODE'
          const fs = require('fs');
          const version = '${{ needs.check-release.outputs.version }}';
          const files = fs.readdirSync('release');
          const required = {
            'darwin-aarch64': /(aarch64|arm64)/i,
          };
          const platforms = {};
          for (const [platform, targetPattern] of Object.entries(required)) {
            const binaries = files.filter(file => file.endsWith('.app.tar.gz') && targetPattern.test(file));
            if (binaries.length !== 1 || !files.includes(`${binaries[0]}.sig`)) {
              throw new Error(`Invalid ${platform} artifact set: ${binaries.join(', ') || 'none'}`);
            }
            const binary = binaries[0];
            const signature = fs.readFileSync(`release/${binary}.sig`, 'utf8').trim();
            if (!signature) throw new Error(`Empty signature for ${binary}`);
            platforms[platform] = {
              signature,
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/${encodeURIComponent(binary)}`,
            };
          }
          fs.writeFileSync('release/latest.json', JSON.stringify({
            version,
            pub_date: new Date().toISOString(),
            notes: process.env.RELEASE_NOTES,
            platforms,
          }, null, 2));
          NODE

      - name: Ensure GitHub Pages branch exists
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/gh-pages',
              });
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: blob } = await github.rest.git.createBlob({
              owner: context.repo.owner,
              repo: context.repo.repo,
              content: '',
              encoding: 'utf-8',
            });
            const { data: tree } = await github.rest.git.createTree({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tree: [{ path: '.nojekyll', mode: '100644', type: 'blob', sha: blob.sha }],
            });
            const { data: commit } = await github.rest.git.createCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              message: 'chore(updater): initialize static update feed',
              tree: tree.sha,
              parents: [],
            });
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'refs/heads/gh-pages',
              sha: commit.sha,
            });

      - name: Ensure GitHub Pages serves the static feed
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const { data: page } = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              if (page.source?.branch !== 'gh-pages' || page.source?.path !== '/') {
                throw new Error('GitHub Pages must use the gh-pages branch root for the desktop updater feed');
              }
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createPagesSite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              source: { branch: 'gh-pages', path: '/' },
            });

      - name: Checkout static feed branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: update-feed

      - name: Promote validated stable manifest
        run: |
          mkdir -p update-feed/updates/desktop/stable
          cp release/latest.json update-feed/updates/desktop/stable/latest.json
          touch update-feed/.nojekyll
          cd update-feed
          node -e "const feed = require('./updates/desktop/stable/latest.json'); if (!feed.version || !feed.platforms?.['darwin-aarch64'] || Object.keys(feed.platforms).length !== 1) process.exit(1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll updates/desktop/stable/latest.json
          git diff --cached --quiet || git commit -m "chore(updater): promote v${{ needs.check-release.outputs.version }}"
          git push origin HEAD:gh-pages

      - name: Summary
        run: |
          echo "## Desktop update feed promoted" >> "$GITHUB_STEP_SUMMARY"
          echo "https://sunday-studio.github.io/aether/updates/desktop/stable/latest.json" >> "$GITHUB_STEP_SUMMARY"
